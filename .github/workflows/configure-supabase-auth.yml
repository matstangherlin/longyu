name: Configure Supabase Auth

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "site_url do Auth"
        required: true
        default: "https://singular-meringue-7838cd.netlify.app"
      add_prod_url:
        description: "URL extra de redirect (opcional)"
        required: false
        default: "https://longyu.app"
      confirm:
        description: "Digite MERGE-AUTH-REDIRECTS"
        required: true
      expected_sha:
        description: "SHA da main revisada"
        required: true

jobs:
  configure:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Guard
        env:
          CONFIRM: ${{ inputs.confirm }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "SOURCE_NOT_MAIN"; exit 6; fi
          if [ "$CONFIRM" != "MERGE-AUTH-REDIRECTS" ]; then echo "CONFIRMATION_MISSING"; exit 6; fi
          if [ -z "$EXPECTED_SHA" ]; then echo "EXPECTED_SHA_REQUIRED"; exit 6; fi
      - uses: actions/checkout@v4
      - name: SHA esperado
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "${head#"$EXPECTED_SHA"}" = "$head" ]; then echo "STALE: $head != $EXPECTED_SHA"; exit 6; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve auth URLs
        id: urls
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "site_url=${{ inputs.site_url }}" >> "$GITHUB_OUTPUT"
            echo "add_prod_url=${{ inputs.add_prod_url }}" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://longyu.com.br" >> "$GITHUB_OUTPUT"
            echo "add_prod_url=https://longyu.com.br" >> "$GITHUB_OUTPUT"
          fi

      - name: Enable email confirmation (mailer_autoconfirm=false)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: drjcfalvlbbeblmmyhwj
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret ausente"
            exit 1
          fi
          npm run configure:supabase-auth -- \
            --confirm-merge \
            --site-url "${{ steps.urls.outputs.site_url }}" \
            --add-prod-url "${{ steps.urls.outputs.add_prod_url }}" \
            --add-prod-url "https://www.longyu.com.br" \
            --add-prod-url "https://longyu.netlify.app" \
            --add-prod-url "https://singular-meringue-7838cd.netlify.app"

      - name: Verify auth config
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: drjcfalvlbbeblmmyhwj
        run: npm run audit:supabase
