name: Apply Security Migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply pending database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: drjcfalvlbbeblmmyhwj
        run: npm run db:apply-api

      - name: Deploy hardened Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy create-account --project-ref drjcfalvlbbeblmmyhwj --no-verify-jwt
          npx supabase functions deploy issue-anon-ingestion-session --project-ref drjcfalvlbbeblmmyhwj --no-verify-jwt
          npx supabase functions deploy stripe-webhook --project-ref drjcfalvlbbeblmmyhwj --no-verify-jwt

      - name: Cleanup agent staging helpers
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: drjcfalvlbbeblmmyhwj
        run: |
          node <<'NODE'
          const ref = process.env.SUPABASE_PROJECT_REF;
          const token = process.env.SUPABASE_ACCESS_TOKEN;
          const query = `
            drop table if exists public._agent_sql_staging;
            drop function if exists public._agent_exec_b64(text);
          `;
          const res = await fetch(`https://api.supabase.com/v1/projects/${ref}/database/query`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${token}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ query }),
          });
          const text = await res.text();
          console.log(res.status, text.slice(0, 500));
          if (!res.ok) process.exit(1);
          NODE
        continue-on-error: true
