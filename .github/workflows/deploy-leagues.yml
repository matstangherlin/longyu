name: Deploy Leagues

# RC2.3.10C — the historical path reapplied supabase/migrations/004_leagues.sql,
# which recreates the recursive league policy. That command is refused.
# League changes ship only as a reviewed, versioned migration
# (supabase/pending/rc2-3-10-league-memberships-policy-recursion.sql)
# through PRODUCTION_MIGRATION_READY.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite REFUSE-004 para registrar que o caminho antigo está desligado"
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Refuse blind 004_leagues.sql replay
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          echo "DEPLOY_LEAGUES_REFUSED: 004_leagues.sql must not be reapplied."
          echo "Use the versioned league policy migration after PRODUCTION_MIGRATION_READY."
          if [ "$CONFIRM" != "REFUSE-004" ]; then
            echo "CONFIRMATION_MISSING"; exit 6
          fi
          exit 6
