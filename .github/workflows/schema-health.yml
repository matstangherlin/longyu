name: Schema health (manual, read-only)

# QA 2026-10 prompt 03. Não roda em push nem em pull_request.
# Secrets no GitHub: SUPABASE_URL e SUPABASE_ANON_KEY (anon, nunca service_role).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-health:
    name: Schema health (GET/OPTIONS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Health check somente leitura
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run check:schema-health
