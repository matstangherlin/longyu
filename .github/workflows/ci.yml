name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # RC2.3.9 — Stack Convergence. validate:beta is the canonical runner over
  # scripts/release/canonical-suites.mjs. Each suite runs in its OWN job on a
  # fresh checkout (no shared files between suites), so the old 400-step
  # sequential chain becomes parallel without changing what runs: the
  # convergence gate proves every legacy step still runs in exactly one suite.
  release-truth:
    name: Release truth (fast failure)
    runs-on: ubuntu-latest
    steps:
      # Full history: RC2.2.22 release-truth exige que RC2_2_22_BASE_SHA
      # seja ancestral do HEAD (clone shallow = BASE_SHA_AMBIGUOUS falso).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Product truth, stack convergence, typecheck, security boundaries,
      # freezes and fingerprint chain: cheap and fundamental, so they fail
      # in minutes instead of after the whole suite matrix.
      - name: Canonical suite release-truth
        run: npm run validate:beta -- --suite release-truth --json reports/beta-gates-release-truth.json

      - name: Upload gate result (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-gates-release-truth
          path: reports/beta-gates-release-truth.json
          if-no-files-found: warn

  beta-suites:
    name: Beta suite ${{ matrix.id }}
    runs-on: ubuntu-latest
    needs: release-truth
    strategy:
      # Every suite reports; one red suite still turns the quality gate red.
      fail-fast: false
      matrix:
        include:
          - id: learner-systems
            suites: --suite learner-systems
          - id: pedagogy-structure
            suites: --suite pedagogy-structure
          - id: pedagogy-mastery
            suites: --suite pedagogy-mastery
          - id: pedagogy-progression
            suites: --suite pedagogy-progression
          - id: conversation-everyday
            suites: --suite conversation-everyday
          - id: experience
            suites: --suite experience
          - id: culture-identity-v6
            suites: --suite culture --suite identity-commercial --suite pedagogy-v6-stack
          - id: android-foundation
            suites: --suite android-foundation
          - id: android-runtime
            suites: --suite android-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (audio quality gates)
        timeout-minutes: 3
        run: |
          set -euo pipefail
          # Apt Azure mirrors intermittently crawl (80+ packages) and hit step timeouts.
          # Static build from GitHub CDN is one archive + predictable PATH install.
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -1
            exit 0
          fi
          ARCHIVE="$RUNNER_TEMP/ffmpeg-static.tar.xz"
          curl -fsSL --retry 4 --retry-delay 2 \
            -o "$ARCHIVE" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
          tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP"
          BIN="$(find "$RUNNER_TEMP" -type f -path '*/bin/ffmpeg' | head -1)"
          PROBE="$(find "$RUNNER_TEMP" -type f -path '*/bin/ffprobe' | head -1)"
          test -n "$BIN" && test -n "$PROBE"
          sudo install -m 755 "$BIN" /usr/local/bin/ffmpeg
          sudo install -m 755 "$PROBE" /usr/local/bin/ffprobe
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Validate beta (canonical suites)
        run: npm run validate:beta -- ${{ matrix.suites }} --json reports/beta-gates-${{ matrix.id }}.json

      - name: Upload gate result (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-gates-${{ matrix.id }}
          path: reports/beta-gates-${{ matrix.id }}.json
          if-no-files-found: warn

      # Relatórios de qualidade regenerados pela cadeia beta (com procedência
      # e hash de integridade). Todos são gerados na suite pedagogy-progression,
      # que termina com validate:report-freshness — sempre anexados, mesmo em falha.
      - name: Upload quality reports
        if: always() && matrix.id == 'pedagogy-progression'
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            reports/exercise-depth-report.md
            reports/image-coverage-report.md
            reports/conversation-coverage-report.md
            reports/conversation-pedagogy-report.md
            reports/lesson-novelty-report.md
          if-no-files-found: error

  quality:
    name: Portão de qualidade (validate:beta + build)
    runs-on: ubuntu-latest
    needs: [release-truth, beta-suites]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # validate:beta already passed suite by suite (release-truth + beta-suites);
      # this job only runs once every suite is green.
      - name: Build
        run: npm run build

      - name: Frontend secrets (post-build)
        run: npm run validate:frontend-secrets

      # RC2.2.10B — o web releaseável sai do MESMO SHA que o Android. Só chega
      # aqui se validate:beta, build e secrets passaram (build quebrado = nenhum
      # artefato web). O deploy continua sendo o do Netlify (integração Git);
      # este job não publica nada.
      - name: Web build identity (SHA pós-merge)
        id: web
        run: node scripts/release-identity.mjs web --expect-sha "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload web dist (longyu-web-<sha>)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.web.outputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  e2e:
    name: Testes E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: warn

  e2e-cross-browser:
    name: E2E cross-engine (WebKit + Firefox)
    runs-on: ubuntu-latest
    needs: quality
    # RC2 P2.1 — WebKit passa a BLOQUEAR.
    #
    # Até aqui o passo era `continue-on-error: true`, justificado por flakes de
    # overlay/timeout. Isso era defensável enquanto o alvo era beta fechada: o
    # Chromium segurava o merge e o WebKit informava. Não é defensável para
    # beta pública, porque em iPhone o Safari NÃO é uma engine alternativa —
    # é a única. Um flake que "não cobre caminho crítico" no CI cobre 100% do
    # caminho de um usuário de iOS.
    #
    # Firefox já era bloqueante desde a V4.7.4 (o flake determinístico de
    # atalho numérico foi corrigido lá).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (webkit + firefox)
        run: npx playwright install webkit firefox chromium --with-deps

      - name: E2E WebKit (Safari) + mobile Safari
        # Bloqueante a partir da RC2. Se falhar, o candidate é NO-GO — sem
        # "quase passou", sem re-run até ficar verde por sorte.
        run: npm run test:e2e:webkit

      - name: E2E Firefox
        # `if: always()` porque o passo do WebKit agora BLOQUEIA, e sem isto uma
        # falha nele aborta o job antes do Firefox — trocaríamos "WebKit mudo"
        # por "Firefox mudo", que é o mesmo defeito virado do avesso.
        #
        # Isto não afrouxa nada: o job continua vermelho se qualquer um dos dois
        # falhar. Só garante que os dois motores sempre reportem.
        if: always()
        run: npm run test:e2e:firefox

      - name: Upload cross-browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: playwright-report
          if-no-files-found: warn
