# Longyu — configuração local Supabase CLI.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "longyu"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = [
  "http://127.0.0.1:4173",
  "http://localhost:5173",
  "http://127.0.0.1:5173/confirmar-email",
  "http://localhost:5173/confirmar-email",
  "http://127.0.0.1:5173/redefinir-senha",
  "http://localhost:5173/redefinir-senha",
]
enable_signup = true

# LGY-013 — o `supabase start` local lê estes arquivos. Isto não publica nada
# no MandarimProject. `supabase config push` enviaria os caminhos ao projeto
# linkado: não rode esse comando contra produção. O painel continua humano.
[auth.email.template.confirmation]
subject = "Confirme seu email no Longyu"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Seu código para redefinir a senha do Longyu"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme o novo email do Longyu"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.magic_link]
subject = "Entrar no Longyu"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "Convite para o Longyu"
content_path = "./supabase/templates/invite.html"

[auth.email.template.reauthentication]
subject = "Confirme que é você no Longyu"
content_path = "./supabase/templates/reauthentication.html"

# Stripe envia webhooks sem JWT do Supabase.
[functions.stripe-webhook]
verify_jwt = false

# Cadastro público: Admin API cria usuário pendente de confirmação.
[functions.create-account]
verify_jwt = false

# Aceita JWT anon legado e sb_publishable_*; o handler valida o header apikey.
[functions.issue-anon-ingestion-session]
verify_jwt = false

# Formulário público Longyu for Business (validação + rate limit no servidor).
[functions.submit-business-lead]
verify_jwt = false

# Nivelamento: JWT obrigatório; o handler recalcula e persiste via service_role.
[functions.commit-placement]
verify_jwt = true

# Triagem de feedback beta via TypeSafe Jev: JWT obrigatório + is_beta_admin no handler.
[functions.triage-feedback]
verify_jwt = true

# Finaliza onboarding a partir do draft no servidor (nova aba / outro dispositivo).
[functions.finalize-onboarding]
verify_jwt = true
