# Longyu — configuração local Supabase CLI.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "longyu"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:5173"]
enable_signup = true

# Stripe envia webhooks sem JWT do Supabase.
[functions.stripe-webhook]
verify_jwt = false

# Cadastro público: Admin API cria usuário pendente de confirmação.
[functions.create-account]
verify_jwt = false

# Aceita JWT anon legado e sb_publishable_*; o handler valida o header apikey.
[functions.issue-anon-ingestion-session]
verify_jwt = false

# Formulário público Longyu for Business (validação + rate limit no servidor).
[functions.submit-business-lead]
verify_jwt = false
