# Configuração de deploy no Netlify.
# App estático (Vite/PWA). Com backend: defina VITE_BACKEND_MODE=supabase
# e credenciais Supabase nas variáveis de ambiente do site (ver .env.example).

[build]
  # Instalação limpa no Linux; build via node (evita "tsc: Permission denied" em .bin).
  command = "node scripts/assert-netlify-env.mjs && npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Garante binários nativos do Rollup no Linux (evita "Cannot write module @rollup/rollup-linux-x64-gnu").
  NPM_FLAGS = "--include=optional"
  VITE_APP_VERSION = "0.2.0-beta.1"

# Variáveis VITE_* são públicas (entram no bundle). RLS no Supabase protege os dados.
# Production Beta = ambiente principal da beta pública.
[context.production.environment]
  VITE_APP_ENV = "production_beta"
  VITE_APP_VERSION = "0.2.0-beta.1"
  VITE_BACKEND_MODE = "supabase"
  VITE_SUPABASE_URL = "https://drjcfalvlbbeblmmyhwj.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRyamNmYWx2bGJiZWJsbW15aHdqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0NzM1NTQsImV4cCI6MjA5OTA0OTU1NH0.kfIxdPbuYfAWCeEpcEuKhh0Bk2gz652XVK2RBjWq0TU"
  # Explicitamente desligado no ambiente principal.
  VITE_ALLOW_PRO_PREVIEW = "false"
  VITE_USE_TEST_FIXTURES = "false"

# Deploy Preview — NÃO usa o Supabase de produção.
# Projeto preview criado: longyu-preview (wpnmygzxqvmpdlcuwrjp).
# Enquanto o Netlify não tiver as chaves do preview, o build usa modo local
# (progresso só no browser; sem escrita no banco principal).
# Para ligar o preview isolado depois:
#   VITE_BACKEND_MODE=supabase
#   VITE_SUPABASE_URL=https://wpnmygzxqvmpdlcuwrjp.supabase.co
#   VITE_SUPABASE_ANON_KEY=<anon do longyu-preview>
[context.deploy-preview.environment]
  VITE_APP_ENV = "preview"
  VITE_APP_VERSION = "0.2.0-beta.1"
  VITE_BACKEND_MODE = "local"
  VITE_SUPABASE_URL = ""
  VITE_SUPABASE_ANON_KEY = ""
  VITE_ALLOW_PRO_PREVIEW = "false"
  VITE_USE_TEST_FIXTURES = "false"
  VITE_ENABLE_TELEMETRY = "false"
  VITE_ENABLE_BETA_FEEDBACK = "false"

# SPA: qualquer rota (/som, /licao/:id, etc.) cai no index.html.
# Sem isso, atualizar a página numa rota interna daria 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers de segurança básicos (beta pública).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

# Service worker e manifest sempre frescos.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
